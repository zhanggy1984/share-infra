# ============================================================
# api-gateway 共享配置（include 到 http 上下文）
# 5 个 agent 的 server 块共用：resolver / 限流 zone / traceId / 转发头 / SSE / 上传
# ============================================================

# ---- upstream 运行时解析 ----
# Docker embedded DNS（127.0.0.11）只在容器运行后提供；nginx 若启动时强制解析
# proxy_pass 主机名，后端未启动会 [emerg] 退出。用 resolver + set 变量后改为
# 运行时解析：后端容器起来后路由自动生效，无需重启网关。
resolver 127.0.0.11 valid=10s;

# ---- 限流 zone ----
# key 用 $http_x_real_ip（真实用户 IP）：网关的 $remote_addr 是前端 nginx 容器 IP，
# 按其限流 = 按 agent 限流，失效。前端 nginx 已用 proxy_set_header X-Real-IP $remote_addr
# 覆盖客户端伪造值，可信。
limit_req_zone $http_x_real_ip zone=global:10m rate=30r/s;   # 全局兜底
limit_req_zone $http_x_real_ip zone=gq_chat:10m rate=2r/s;   # good-question LLM/SSE 收紧
limit_req_zone $http_x_real_ip zone=cs_chat:10m rate=2r/s;   # customer-service 对话收紧
limit_req_zone $http_x_real_ip zone=cs_auth:10m rate=5r/m;   # customer-service 登录（接管其前端旧限流）
limit_req_zone $http_x_real_ip zone=cc_api:10m rate=10r/s;   # contract-check 业务
limit_req_zone $http_x_real_ip zone=sp_api:10m rate=10r/s;   # smart-procurement 业务
limit_req_zone $http_x_real_ip zone=eval_api:10m rate=10r/s; # agent-evaluation-offline 业务

# ---- 转发头 ----
# X-Real-IP 透传前端已设的真实 IP（$http_x_real_ip），不重新覆盖
proxy_set_header Host $host;
proxy_set_header X-Real-IP $http_x_real_ip;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ---- traceId ----
# 网关是链路根：强制生成新 X-Request-ID 覆盖客户端传入；后端响应同名头隐藏后
# 由网关统一回传，保证客户端响应头唯一（避免与后端回传头重复）
proxy_set_header X-Request-ID $request_id;
proxy_hide_header X-Request-ID;
add_header X-Request-ID $request_id always;

# ---- SSE / 长连接 ----
# 统一关缓冲：good-question/customer-service 有流式响应，漏配会导致 SSE 中断；
# 5 个 agent 均为小流量内网，关缓冲无性能影响
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 300s;
proxy_connect_timeout 10s;
proxy_http_version 1.1;
proxy_set_header Connection "";

# ---- 上传 ----
client_max_body_size 50m;
