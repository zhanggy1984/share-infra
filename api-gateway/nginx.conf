# ============================================================
# api-gateway 统一 API 网关层 — nginx 主配置
#
# 架构：各前端 nginx 之后、5 个后端之前，按 Host 虚拟域名路由：
#   gq.local    -> rag-backend:8080              (good-question)
#   cs.local    -> customer-service-backend:8000 (customer-service)
#   cc.local    -> contract-check-backend:8000   (contract-check)
#   sp.local    -> sp-app:8000                   (smart-procurement)
#   eval.local  -> ai-eval-backend:8000          (agent-evaluation-offline)
#
# 能力：traceId 生成（X-Request-ID）+ 限流（按真实 IP）+ SSE 透传。
# 共享配置见 conf.d/gateway.conf（include 到 http 上下文）。
# 可替换性：路由/限流/traceId 均为标准契约，未来可整体换 APISIX / Istio。
#
# 注意：upstream 用 set 变量 + resolver（Docker embedded DNS 127.0.0.11）做
# 运行时解析——nginx 启动时不强制解析后端主机名，后端容器未启动也能起网关，
# 后端就绪后路由自动生效（见 conf.d/gateway.conf 的 resolver 说明）。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # 网关层共享能力：resolver / 限流 zone / traceId / 转发头 / SSE / 上传
    include /etc/nginx/conf.d/gateway.conf;

    # ============ good-question (gq.local) ============
    server {
        listen 8099;
        server_name gq.local;
        location /api/ {
            limit_req zone=global burst=50 nodelay;
            limit_req zone=gq_chat burst=10 nodelay;
            set $upstream_gq http://rag-backend:8080;
            proxy_pass $upstream_gq;
        }
    }

    # ============ customer-service (cs.local) ============
    server {
        listen 8099;
        server_name cs.local;
        location /api/ {
            limit_req zone=global burst=50 nodelay;
            limit_req zone=cs_chat burst=10 nodelay;
            set $upstream_cs http://customer-service-backend:8000;
            proxy_pass $upstream_cs;
        }
        # 登录接口单独收紧（接管 customer-service 前端旧 limit_req 的 5r/m）
        location /api/v1/auth/ {
            limit_req zone=cs_auth burst=5 nodelay;
            set $upstream_cs http://customer-service-backend:8000;
            proxy_pass $upstream_cs;
        }
        # 健康探针
        location = /healthz {
            set $upstream_cs http://customer-service-backend:8000;
            proxy_pass $upstream_cs;
        }
    }

    # ============ contract-check (cc.local) ============
    server {
        listen 8099;
        server_name cc.local;
        location /api/ {
            limit_req zone=global burst=50 nodelay;
            limit_req zone=cc_api burst=20 nodelay;
            set $upstream_cc http://contract-check-backend:8000;
            proxy_pass $upstream_cc;
        }
    }

    # ============ smart-procurement (sp.local) ============
    server {
        listen 8099;
        server_name sp.local;
        location /api/ {
            limit_req zone=global burst=50 nodelay;
            limit_req zone=sp_api burst=20 nodelay;
            set $upstream_sp http://sp-app:8000;
            proxy_pass $upstream_sp;
        }
        # 存活/就绪探针（不在 /api/ 前缀内）
        location = /health/live {
            set $upstream_sp http://sp-app:8000;
            proxy_pass $upstream_sp;
        }
        location = /health/ready {
            set $upstream_sp http://sp-app:8000;
            proxy_pass $upstream_sp;
        }
    }

    # ============ agent-evaluation-offline (eval.local) ============
    server {
        listen 8099;
        server_name eval.local;
        location /api/ {
            limit_req zone=global burst=50 nodelay;
            limit_req zone=eval_api burst=20 nodelay;
            set $upstream_eval http://ai-eval-backend:8000;
            proxy_pass $upstream_eval;
        }
        # 健康探针（前端 nginx 也反代 /healthz）
        location = /healthz {
            set $upstream_eval http://ai-eval-backend:8000;
            proxy_pass $upstream_eval;
        }
    }

    # ============ 兜底：未知 Host 一律拒绝，防止串线到任一 agent ============
    server {
        listen 8099 default_server;
        server_name _;
        location /gateway/health {
            access_log off;
            return 200 'ok\n';
        }
        location / {
            return 403;
        }
    }
}
