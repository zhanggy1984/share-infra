# ============================================================
# 共享中间件 infra — 5 个 agent 共用一套 MySQL / Redis / Neo4j / Milvus / BGE-M3
#
# 设计要点：
# - 应用容器永远按逻辑主机名访问：mysql / redis / milvus / neo4j / bge-m3
#   （本 compose 通过 network aliases 对外暴露逻辑名，agent 挂 external shared-infra 即可直连）
# - BGE-M3 embedding 服务 2026-08-25 从 smart-procurement 迁入（未来其他 agent 复用）
# - 宿主端口高位起步（33061/36379/…），仅供工具调试；P4 旧栈全停后统一改标准端口
# - MySQL 只建库 + 账号 + 授权，不含任何业务表（表由各 agent 应用启动自建）
# - Milvus 用独立 etcd/minio 伴生（外部对象存储），版本 v2.5.4（P0.2/P0.3 已验证）
# - 数据隔离：MySQL 按 database，Redis 按 db index（sp=/0 cs=/1 gq=/2），Milvus 按 collection 前缀
#
# 启动：docker compose up -d
# ============================================================

name: shared-infra

networks:
  shared-infra:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  neo4j-data:
  etcd-data:
  minio-data:
  milvus-data:
  bge-m3-model:
  es-data:
  kafka-data:

services:
  # ==================== MySQL 8.0（逻辑名 mysql）====================
  mysql:
    image: mysql:8.0
    container_name: shared-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 兼容 5 个 agent 全部驱动（PyMySQL / asyncmy / aiomysql），统一用 native_password
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      # 库与账号由 init/mysql/01-create-databases.sh 创建：密码经 compose 从 .env 注入，仓库不存任何凭据
      MYSQL_CONTRACT_USER: ${MYSQL_CONTRACT_USER:?请在 .env 中设置 MYSQL_CONTRACT_USER}
      MYSQL_CONTRACT_PASSWORD: ${MYSQL_CONTRACT_PASSWORD:?请在 .env 中设置 MYSQL_CONTRACT_PASSWORD}
      MYSQL_RAG_USER: ${MYSQL_RAG_USER:?请在 .env 中设置 MYSQL_RAG_USER}
      MYSQL_RAG_PASSWORD: ${MYSQL_RAG_PASSWORD:?请在 .env 中设置 MYSQL_RAG_PASSWORD}
      MYSQL_CS_USER: ${MYSQL_CS_USER:?请在 .env 中设置 MYSQL_CS_USER}
      MYSQL_CS_PASSWORD: ${MYSQL_CS_PASSWORD:?请在 .env 中设置 MYSQL_CS_PASSWORD}
      MYSQL_EVAL_USER: ${MYSQL_EVAL_USER:?请在 .env 中设置 MYSQL_EVAL_USER}
      MYSQL_EVAL_PASSWORD: ${MYSQL_EVAL_PASSWORD:?请在 .env 中设置 MYSQL_EVAL_PASSWORD}
      # P2-C3 迁移专用账号（DDL，仅 ai_evaluation 用）；其余 agent 不填不影响启动
      MYSQL_EVAL_MIGRATE_USER: ${MYSQL_EVAL_MIGRATE_USER:-evaluation_migrate}
      MYSQL_EVAL_MIGRATE_PASSWORD: ${MYSQL_EVAL_MIGRATE_PASSWORD:-CHANGE_ME}
      MYSQL_SP_USER: ${MYSQL_SP_USER:?请在 .env 中设置 MYSQL_SP_USER}
      MYSQL_SP_PASSWORD: ${MYSQL_SP_PASSWORD:?请在 .env 中设置 MYSQL_SP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      shared-infra:
        aliases: [mysql]

  # ==================== Redis 7（逻辑名 redis）====================
  redis:
    image: redis:7-alpine
    container_name: shared-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-36379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    networks:
      shared-infra:
        aliases: [redis]

  # ==================== Neo4j 5（逻辑名 neo4j）====================
  neo4j:
    image: neo4j:5
    container_name: shared-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 1024m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_default__listen__address: 0.0.0.0
    ports:
      - "${NEO4J_HTTP_PORT:-37474}:7474"
      - "${NEO4J_BOLT_PORT:-37687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 2g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      shared-infra:
        aliases: [neo4j]

  # ==================== Milvus 伴生：etcd（元数据）====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: shared-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    networks:
      shared-infra: {}

  # ==================== Milvus 伴生：minio（对象存储）====================
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: shared-minio
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/minio_data
    ports:
      - "${MINIO_API_PORT:-39000}:9000"
      - "${MINIO_CONSOLE_PORT:-39001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: "0.5"
    restart: unless-stopped
    networks:
      shared-infra: {}

  # ==================== Milvus 2.5.4（逻辑名 milvus，统一版本）====================
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: shared-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-39530}:19530"
      - "${MILVUS_METRIC_PORT:-39091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 4g
    cpus: "2.0"
    restart: unless-stopped
    networks:
      shared-infra:
        aliases: [milvus]

  # ==================== Attu：Milvus 可视化管理 UI（一个就够）====================
  attu:
    image: zilliz/attu:v2.5.6
    container_name: shared-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-38000}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: "0.5"
    restart: unless-stopped
    networks:
      shared-infra: {}

  # ==================== BGE-M3 Embedding（逻辑名 bge-m3，通用中间件）====================
  # 从 smart-procurement 迁入（2026-08-25）：sp 自建 embedding 提升为共享服务，
  # 未来其他 agent（RAG 类）可直接用 http://bge-m3:8081。
  # 模型懒加载（首次 /embed 触发），模型卷 bge-m3-model 由 sp 旧卷迁移复用，免重新下载。
  bge-m3:
    build:
      context: ./docker/bge-m3
      dockerfile: Dockerfile
    container_name: shared-bge-m3
    environment:
      # huggingface.co 国内不可达，走 hf-mirror 镜像下载 BAAI/bge-m3（一次进卷长期复用）
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /app/.cache
    ports:
      - "${BGE_M3_PORT:-38081}:8081"
    volumes:
      - bge-m3-model:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 4g
    cpus: "2.0"
    restart: unless-stopped
    networks:
      shared-infra:
        aliases: [bge-m3]

  # ==================== Elasticsearch 8.13.4（逻辑名 elasticsearch，agent-evaluation-online 观测存储）====================
  # 2026-09-03 增：online 平台（agent-evaluation-online）事件/日志/rollup index 存储。IK 中文分词走自构建 docker/es。
  # dev 共享底座不启安全（xpack.security.enabled=false）；SASL/TLS/ACL 断言在隔离安全实例做（task.md T-4.10），不污染共享实例。
  elasticsearch:
    build:
      context: ./docker/es
      dockerfile: Dockerfile
    container_name: shared-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ES_HTTP_PORT:-39200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 2g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      shared-infra:
        aliases: [elasticsearch]

  # ==================== Kafka 3.8.0 KRaft 单节点（逻辑名 kafka，agent-evaluation-online 事件通道）====================
  # 2026-09-03 增：online 事件上报 topic（{env}.obs.agent.*）。dev 共享底座 PLAINTEXT 无鉴权
  # （ACL/SASL 断言在隔离安全实例做，task.md T-4.10）；生产安全配置在上线门（§17）与 infra 敲定。
  kafka:
    image: apache/kafka:3.8.0
    container_name: shared-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-39092}:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1g
    cpus: "0.75"
    restart: unless-stopped
    networks:
      shared-infra:
        aliases: [kafka]

  # ==================== ES template/ILM 一次性 init（es-init，restart: no）====================
  # 2026-09-08 增：obs 事件/日志 index template + ILM 30d 策略落建（agent-evaluation-online 平台提交物
  # agent-evaluation-online/es-template/ 的同构快照，mapping 唯一源 = online backend consumer/es.py::_MAPPING）。
  # ES 无 docker-entrypoint-initdb.d 等价物 → 一次性 init 服务（语义对齐 mysql init/mysql/）；重跑 `docker
  # compose up es-init` 幂等（PUT 覆盖）。主 `up` 时已退出的 es-init 会随 compose 重跑（幂等无害）。
  es-init:
    image: curlimages/curl:latest
    container_name: shared-es-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /init/apply.sh && echo 'es-init 完成' && sleep 2"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_URL: http://elasticsearch:9200
      ENV: ${OBS_ENV:-dev}
    volumes:
      - ./init/es:/init:ro
    mem_limit: 64m
    restart: "no"
    networks:
      - shared-infra
